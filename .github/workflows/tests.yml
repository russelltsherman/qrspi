name: tests

# Regression gate for the qrspi Python script suite. The aggregating runner
# (scripts/run_tests.py) executes every scripts/*_test.py and exits non-zero if
# any fails, which fails the job. JavaScript coverage (the qrspi-batch.js
# workflow orchestrator) is deferred to future development.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Default-deny; the one job only needs to read the checked-out code.
permissions: {}

# Collapse superseded runs on the same ref (Graphite restacks push often).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show Python version
        run: python3 --version

      # The suite is stdlib-only (no pytest, no third-party imports), so there
      # is no dependency-install step; ubuntu-24.04 ships Python 3.12.
      - name: Run Python test suite
        run: python3 scripts/run_tests.py
