name: tests

# Regression gate for the qrspi scripts. The `python` job runs the aggregating
# runner (scripts/run_tests.py) over every scripts/*_test.py; the
# `workflow-syntax` job statically validates the Claude Code Workflow scripts
# (.claude/workflows/*.js) via scripts/check_workflows.js. Either job failing
# fails the check. (Deeper JS unit coverage of the orchestrator is tracked
# separately — see docs/testing-dynamic-workflows.md.)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Default-deny; the one job only needs to read the checked-out code.
permissions: {}

# Collapse superseded runs on the same ref (Graphite restacks push often).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show Python version
        run: python3 --version

      # The suite is stdlib-only (no pytest, no third-party imports), so there
      # is no dependency-install step; ubuntu-24.04 ships Python 3.12.
      - name: Run Python test suite
        run: python3 scripts/run_tests.py

  workflow-syntax:
    name: Workflow script syntax
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show Node version
        run: node --version

      # ubuntu-24.04 ships Node, so no setup step. The gate compiles each
      # workflow script the way the harness loads it (see check_workflows.js).
      - name: Validate workflow scripts
        run: node scripts/check_workflows.js .claude/workflows/*.js
